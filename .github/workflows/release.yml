name: Release

# Runs on any pushed tag, e.g.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6, esp32c5]
    env:
      IDF_VERSION: v5.5.2
      # Export IDF_TARGET so CMake project() name becomes blackmagic-esp32c6/esp32c5
      IDF_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js (frontend build inside CMake)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ESP-IDF
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-${{ env.IDF_VERSION }}-${{ matrix.target }}

      - name: Clone ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 --branch "$IDF_VERSION" \
            https://github.com/espressif/esp-idf.git ~/esp-idf

      - name: Install ESP-IDF tools
        run: ~/esp-idf/install.sh ${{ matrix.target }}

      - name: Build firmware
        shell: bash
        run: |
          . ~/esp-idf/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py merge-bin -o merged-flash.bin

      - name: Collect artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          cp "build/blackmagic-${TARGET}.bin" "dist/blackmagic-${VERSION}-${TARGET}.bin"
          cp "build/blackmagic-${TARGET}.elf" "dist/blackmagic-${VERSION}-${TARGET}.elf"
          cp build/bootloader/bootloader.bin           "dist/bootloader-${VERSION}-${TARGET}.bin"
          cp build/partition_table/partition-table.bin "dist/partition-table-${VERSION}-${TARGET}.bin"
          cp build/flash_args "dist/flash_args-${VERSION}-${TARGET}"
          MERGED=$(find . -name merged-flash.bin -newer sdkconfig | head -n1)
          cp "${MERGED:-build/merged-flash.bin}" "dist/blackmagic-${VERSION}-${TARGET}-merged.bin"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
